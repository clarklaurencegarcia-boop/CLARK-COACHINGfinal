<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Clark Coaching</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page { min-height: 80vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
        .auth-card { width:100%; max-width:450px; padding:32px; background:var(--dark-card); border:1px solid rgba(34,197,94,.25); border-radius:16px; }
        .auth-card h1 { color:var(--primary); text-align:center; margin-bottom:10px; }
        .auth-card p { color:#bcb5c3; text-align:center; }
        .auth-card label { color:var(--black); }
        .auth-card button { width:100%; margin-top:12px; }
        .auth-card a { color:var(--primary); }
        .auth-links { margin-top:18px; text-align:center; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Clark<span>Coaching</span></a>
    </nav>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Welcome Back</h1>
            <p>Log in to your Clark Coaching account.</p>

            <form action="login_process.php" method="POST">
                <p>
                    <label for="identity">Username or Email:</label>
                    <input type="text" id="identity" name="identity" required autocomplete="username">
                </p>
                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </p>
                <button type="submit">Log In</button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
                <p><a href="index.html">Back to website</a></p>
            </div>
        </section>
    </main>
</body>
</html>
